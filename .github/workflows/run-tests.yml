name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    env:
      APP_ENV: testing
      MJML_NODE_PATH: null

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, json, tokenizer, pcre
          coverage: none
          ini-values: memory_limit=512M

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Select Laravel version constraints
        run: |
          composer require --no-update \
            illuminate/config:"${{ matrix.laravel }}" \
            illuminate/support:"${{ matrix.laravel }}" \
            illuminate/view:"${{ matrix.laravel }}" \
            illuminate/mail:"${{ matrix.laravel }}"

      - name: Resolve dependencies (${{ matrix.stability }})
        run: |
          if [ "${{ matrix.stability }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mjml CLI
        run: npm i -g mjml

      - name: Sanity check mjml
        run: mjml --version

      - name: Run tests (Pest)
        run: |
          php -v
          ./vendor/bin/pest -v || ./vendor/bin/phpunit -v
